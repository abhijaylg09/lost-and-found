<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report Item - Lost & Found</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Navigation -->

    <nav>

        <div class="logo">
            Lost & Found
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

        </div>

    </nav>



    <!-- Report Form -->

    <section class="section">

        <h2 id="formTitle">
            Report an Item
        </h2>


        <div class="form-container">


            <form id="reportForm">


                <label>
                    Item Name
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="Example: Black Wallet"
                    required
                >


                <label>
                    Category
                </label>

                <select id="category">

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Documents">
                        Documents
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                    <option value="Books">
                        Books
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label>
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Where was it lost/found?"
                    required
                >


                <label>
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    required
                >


                <label>
                    Description
                </label>

                <textarea
                    id="description"
                    rows="5"
                    placeholder="Describe the item..."
                ></textarea>


                <label>
                    Contact Information
                </label>

                <input
                    type="text"
                    id="contact"
                    placeholder="Email or phone number"
                    required
                >


                <button
                    type="submit"
                    class="submit-button"
                >
                    Submit Report
                </button>


            </form>

        </div>

    </section>



    <footer>

        <h3>Lost & Found</h3>

        <p>
            Helping people find what they've lost.
        </p>

    </footer>



    <script>

        // Detect whether the user selected Lost or Found

        const params =
            new URLSearchParams(window.location.search);

        const type =
            params.get("type");


        // Change page title

        if (type === "lost") {

            document.getElementById("formTitle")
                .textContent = "Report Lost Item";

        }

        else if (type === "found") {

            document.getElementById("formTitle")
                .textContent = "Report Found Item";

        }


        // Form submission

        document.getElementById("reportForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const itemName =
                    document.getElementById("itemName").value;

                alert(
                    "Report submitted successfully!\n\n" +
                    "Item: " + itemName
                );

            });

    </script>


</body>

</html>
